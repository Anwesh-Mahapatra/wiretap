model_list:
  - model_name: llama-3.3-70b-versatile
    litellm_params:
      model: groq/llama-3.3-70b-versatile
      api_key: os.environ/GROQ_API_KEY

  - model_name: local-llama
    litellm_params:
      model: ollama_chat/llama3.1:8b
      api_base: http://192.168.1.128:11434

litellm_settings:
  # OTLP export ("otel") was removed alongside Bindplane -- LiteLLM has no
  # Elasticsearch-native span exporter, and gateway telemetry now flows to
  # Elasticsearch only via Module 5+ (see arch.md). To reinstate: add "otel"
  # back here and set OTEL_EXPORTER_OTLP_ENDPOINT/_PROTOCOL on the litellm
  # service pointing at a real OTLP collector.
  success_callback: ["langfuse"]
  failure_callback: ["langfuse"]

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: "postgresql://llmproxy:dbpassword9090@db:5432/litellm"
